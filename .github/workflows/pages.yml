# ============================================================================
# 构建 examples 站点并发布到 GitHub Pages
#
# 使用方式：
#   GitHub → Actions → "Deploy GitHub Pages" → Run workflow
#   （也可在 Actions 页面左侧手动点击运行）
#
# 说明：
#   - 推送 master 分支时自动触发构建发布；也可手动触发（workflow_dispatch）
#   - 使用 bun 安装依赖（仓库使用 bun.lock 锁定）
#   - 构建产物为 packages/examples/dist，通过官方 Pages 动作发布
#   - 部署前需在 Settings → Pages 中将 Source 设为 "GitHub Actions"
# ============================================================================

name: Deploy GitHub Pages

on:
  workflow_dispatch:
    # 可选：手动触发时选择分支（默认为 master）
    inputs:
      ref:
        description: '分支名（默认 master）'
        required: false
        default: 'master'
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build examples
        working-directory: packages/examples
        # 直接执行 vite build（tsc -b 存在上游源包的类型报错，不影响产物）
        run: bunx --bun vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: packages/examples/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
