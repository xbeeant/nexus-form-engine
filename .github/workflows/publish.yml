# ============================================================================
# 发布 @xbeeant/form-engine 系列包到 registry.npmjs.org
#
# 使用方式：
#   1. 打 tag：git tag v0.0.1 && git push origin v0.0.1（自动触发）
#   2. 或在 GitHub → Actions → "Publish to npm" → Run workflow（手动触发）
#
# 说明：
#   - 只发布 packages/core、react、ui、designer（examples 为 private，自动跳过）
#   - lerna publish from-package：仅发布版本号尚未存在于 npm registry 的包，
#     不修改 git、不打 tag，纯发布动作
#   - 每个包 prepublishOnly 会自动执行 npm run build（默认产物不含 sourcemap）
#   - 发布前需在仓库 Settings → Secrets and variables → Actions 中配置
#     NPM_TOKEN（npmjs.org 的 access token，需具备 publish 权限）
# ============================================================================

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '分支名（默认 master）'
        required: false
        default: 'master'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npx lerna run build --ignore=@xbeeant/form-engine-examples

      - name: Test
        run: npx lerna run test --ignore=@xbeeant/form-engine-examples

      - name: Publish to registry.npmjs.org
        run: npx lerna publish from-package --yes